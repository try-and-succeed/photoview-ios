# Update pull requests for what the Flutter client depends on. Each one runs
# through the same required checks as any other pull request, so nothing lands
# on master without analyze, tests and both builds passing.
#
# Security updates are enabled separately in the repository settings and do
# not wait for this schedule.
version: 2

updates:
  # The actions in .github/workflows, pinned to SHAs; Dependabot moves the SHA
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI

  # Dart and Flutter packages of the app. Minor and patch updates come as one
  # pull request a week; a major update gets its own, since it may need code
  # changes.
  - package-ecosystem: pub
    directory: /app_flutter
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: Dependencies
