name: Flutter client

# Only the Flutter port is checked here. The Swift client in Photoview/ has no
# build set up and is left untouched.
on:
  push:
    # Only the default branch. Every other branch is covered by the
    # pull_request trigger below, which has no branch filter — listing feature
    # branches here just leaves dead entries behind once they are merged, and a
    # branch that is not listed is silently unchecked until a PR exists.
    branches: [master]
    paths:
      - 'app_flutter/**'
      - '.github/workflows/flutter.yml'
  # Every pull request, whatever it touches. master requires these three jobs
  # to pass before a merge, and a job that never starts never passes: with a
  # path filter here, a pull request changing only the README or the
  # Dependabot config could not be merged at all.
  pull_request:
  workflow_dispatch:

# Read-only by default, and the checkout steps below drop the token from
# .git/config as well: a pull request build runs code from the branch being
# built, which could otherwise read the token back out and push with it.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags. A tag can be moved to other
# code at any time, and a pull request build would run it; a SHA cannot. The
# version comment is what Dependabot updates alongside the SHA.

env:
  FLUTTER_VERSION: 3.47.4

defaults:
  run:
    working-directory: app_flutter

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    # The iOS build cannot be run on the development machine (Windows), so this
    # job is the only thing that checks it. Unsigned: no certificates needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
